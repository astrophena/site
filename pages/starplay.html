<h1>Starlark Playground</h1>

<p>This interactive playground allows you to experiment with the <a href="https://starlark-lang.org">Starlark programming language</a> directly in the browser, using WebAssembly.</p>

<div class="playground">
  <textarea id="input" name="input">
# You can edit this code!

def hello(name):
    print("Hello, %s!" % name)

hello("world")
</textarea>
  <textarea id="output" name="output" disabled></textarea>
  <button id="run" onclick="run()" disabled>Run</button>
</div>
